name: Deploy to Server

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from JSON
        run: |
          echo '${{ secrets.ENV_JSON }}' \
          | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Setup Runner SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      - name: Prepare Server Directories
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "sudo mkdir -p /app_tmp /app && sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /app_tmp /app"

      - name: Transfer .env and GitHub Deploy Key
        run: |
          # Write GitHub Key to temporary file to SCP it
          echo "${{ secrets.GIT_PRIVATE_KEY }}" > github_deploy_key
          chmod 600 github_deploy_key
          
          # Transfer both files to the temp directory
          scp .env github_deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/app_tmp/

      - name: Configure Server SSH for GitHub
        run: |
          # 1. Create a local config file first
          cat <<EOT > github_ssh_config
          Host github.com
            IdentityFile ~/.ssh/github_deploy_key
            StrictHostKeyChecking no
          EOT

          # 2. Upload the config file
          scp github_ssh_config ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/app_tmp/github_ssh_config

          # 3. Remote execution to move files and set permissions
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            
            # Move the key and config from tmp
            mv /app_tmp/github_deploy_key ~/.ssh/github_deploy_key
            chmod 600 ~/.ssh/github_deploy_key
            
            # Safely append or create the config
            cat /app_tmp/github_ssh_config >> ~/.ssh/config
            chmod 600 ~/.ssh/config
            
            # Cleanup and known_hosts
            rm /app_tmp/github_ssh_config
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          EOF


      - name: Sync Repository and Finalize
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            if [ ! -d "/app/.git" ]; then
              sudo rm -rf /app/*
              git clone -b staging git@github.com:DamienBarnesAutomations/commerce-flow-project.git /app
            else
              cd /app && git pull origin staging
            fi
            
            # Move env from tmp to app
            mv /app_tmp/.env /app/.env
          EOF
