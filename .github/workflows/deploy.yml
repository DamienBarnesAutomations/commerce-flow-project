name: Deploy to Server
on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from JSON
        run: |
          echo '${{ secrets.ENV_JSON }}' \
            | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env
          echo ".env created:"
          cat .env

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy .env and deploy
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

          # Copy .env
          # Correct path for system root folder
          scp .env $USER_NAME@$SERVER_IP:/root/app_tmp/.env


          # SSH into server and deploy
          ssh $USER_NAME@$SERVER_IP "
          # 1. Handle Git (using sudo if /app is root-owned)
          if [ ! -d '/app/.git' ]; then
            sudo git clone -b staging git@github.com:DamienBarnesAutomations/commerce-flow-project.git /app
          else
            cd /app && sudo git pull
          fi

          # 2. Move the .env file
          # We check the /root/ path you defined in your cloud-config
          if [ -f '/root/app_tmp/.env' ]; then
            sudo mv /root/app_tmp/.env /app/.env
            sudo chmod 600 /app/.env
          else
            echo 'Warning: .env not found in /root/app_tmp/'
          fi

          # 3. Docker Compose
          cd /app
          #sudo docker compose up --build -d
          "