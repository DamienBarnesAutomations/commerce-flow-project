name: Deploy to Server
on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from JSON
        run: |
          echo '${{ secrets.ENV_JSON }}' \
            | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env
          echo ".env created:"
          cat .env

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Deploy and Setup Repository
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GIT_PRIVATE_KEY: ${{ secrets.GIT_PRIVATE_KEY }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          # Local SSH Setup for GitHub Actions runner
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

          # 1. Create temporary and target directories
          ssh $USER_NAME@$SERVER_IP "sudo mkdir -p /app_tmp /app && sudo chown -R $USER_NAME:$USER_NAME /app_tmp /app"

          # 2. SCP the generated .env to the temporary folder
          scp .env $USER_NAME@$SERVER_IP:/app_tmp/.env

          # 3. Remote execution: Setup Git and move .env
          ssh $USER_NAME@$SERVER_IP << 'EOF'
            # Setup GitHub Deploy Key on the server
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ secrets.GIT_PRIVATE_KEY }}" > ~/.ssh/github_deploy_key
            chmod 600 ~/.ssh/github_deploy_key

            # Configure SSH for GitHub access
            cat <<EOT > ~/.ssh/config
            Host github.com
              IdentityFile ~/.ssh/github_deploy_key
              StrictHostKeyChecking no
            EOT

            ssh-keyscan -H github.com >> ~/.ssh/known_hosts

            # Handle Repository
            if [ ! -d "/app/.git" ]; then
              # If /app is empty or just has files but no .git, we clean and clone
              # Note: git clone requires an empty directory
              sudo rm -rf /app/*
              git clone -b staging git@github.com:DamienBarnesAutomations/commerce-flow-project.git /app
            else
              cd /app && git pull
            fi

            # Move the .env from tmp to the final app directory
            mv /app_tmp/.env /app/.env
          EOF

