name: Deploy to Server

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from JSON
        run: |
          echo '${{ secrets.ENV_JSON }}' \
          | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Setup Runner SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      - name: Prepare Server Directories
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "sudo mkdir -p /app_tmp && sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /app_tmp"

      - name: Transfer Setup Files
        run: |
          # Prepare Key
          echo "${{ secrets.GIT_PRIVATE_KEY }}" > github_deploy_key
          chmod 600 github_deploy_key
          
          # Prepare SSH Config
          cat <<EOT > github_ssh_config
          Host github.com
            IdentityFile ~/.ssh/github_deploy_key
            StrictHostKeyChecking no
          EOT

          # Transfer everything at once
          scp .env github_deploy_key github_ssh_config ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/app_tmp/

      - name: Configure Server SSH for GitHub
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            
            # Move and protect key
            mv /app_tmp/github_deploy_key ~/.ssh/github_deploy_key
            chmod 600 ~/.ssh/github_deploy_key
            
            # Replace config with clean version
            mv /app_tmp/github_ssh_config ~/.ssh/config
            chmod 600 ~/.ssh/config
            
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          EOF

      - name: Sync Repository and Finalize
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            if [ ! -d "/app/.git" ]; then
              sudo mkdir -p /app
              sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /app
              sudo rm -rf /app/*
              git clone -b staging git@github.com:DamienBarnesAutomations/commerce-flow-project.git /app
            else
              cd /app
              git fetch origin staging
              git reset --hard origin/staging
            fi
            
            mv /app_tmp/.env /app/.env
          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /app
            sudo docker compose up -d --build --remove-orphans
            sudo docker image prune -f
          EOF
