$IP = Read-Host "Enter Server IP"
$RemoteUser = Read-Host "Enter SSH Username (e.g., root)"

$Script = @'
# 1. Update and Install
apt-get update && apt-get install -y docker.io docker-compose-v2 git jq

# 2. Create Deploy User
NEW_USER="deploy_user"
if ! id "$NEW_USER" &>/dev/null; then
    adduser --disabled-password --gecos "" "$NEW_USER"
    usermod -aG sudo,docker "$NEW_USER"
    
    # Copy SSH keys from root to the new user
    mkdir -p /home/$NEW_USER/.ssh
    [ -f /root/.ssh/authorized_keys ] && cp /root/.ssh/authorized_keys /home/$NEW_USER/.ssh/
    chown -R $NEW_USER:$NEW_USER /home/$NEW_USER/.ssh
    chmod 700 /home/$NEW_USER/.ssh
    chmod 600 /home/$NEW_USER/.ssh/authorized_keys
fi

# 3. Set Permissions for Git/CI CD
echo "$NEW_USER ALL=(ALL) NOPASSWD: /usr/bin/mkdir, /usr/bin/chown, /usr/bin/rm, /usr/bin/docker, /usr/bin/chmod" > /etc/sudoers.d/deploy-perms
chmod 440 /etc/sudoers.d/deploy-perms

mkdir -p /app
chown -R $NEW_USER:$NEW_USER /app

echo "SUCCESS: User $NEW_USER is ready for deployment."
'@

# This sends the string directly to a remote bash shell
$Script | ssh -t "${RemoteUser}@${IP}" "sudo bash"