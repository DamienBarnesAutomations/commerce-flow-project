name: Build and Deploy Docker Image

on:
  push:
    branches:
      - staging 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code (Updated to v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry (Updated to v3)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Build and Push using Docker Compose
      # Tip: Ensure your docker-compose.yml uses variables for image names
      # e.g., image: ghcr.io/${{ github.repository }}/my-app:latest
      - name: Build and Push Docker images
        run: |
          docker-compose build
          docker-compose push
