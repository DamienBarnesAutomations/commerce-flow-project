services:
  # The Memory: Database
  db:
    image: postgres:15
    container_name: standard_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # You can change this later
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Brain: Automation (n8n)
  n8n:
    image: n8nio/n8n:latest
    container_name: standard_brain
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - TELEGRAM_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_PROTOCOL=https
    volumes:
      - ./flows:/home/node/.n8n
      - ./public/images:/home/node/.n8n-files/public/images
      - ./n8n-workflows:/home/node/.n8n-files/workflows
    depends_on:
      db:
        condition: service_healthy

  # The Screen: Tablet UI (Appsmith)
  appsmith:
    image: appsmith/appsmith-ce
    container_name: standard_terminal
    restart: always
    ports:
      - "8081:80"  # You visit http://localhost:8081
      - "8443:443"
    environment:
      - APPSMITH_JAVA_HEAP_MIN=512M
      - APPSMITH_JAVA_HEAP_MAX=1024M
      - APPSMITH_MONGODB_MAX_POOL_SIZE=10
    volumes:
      - ./appsmith-data:/appsmith-stacks
    shm_size: '2gb'
    mem_limit: 4g
    healthcheck:
      # Pings port 80 because this command runs INSIDE the container
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # The Helper: Python Worker
  worker:
    build: ./worker
    container_name: standard_helper
    restart: always
    volumes:
      - ./worker:/app
    depends_on:
      db:
        condition: service_healthy