services:
  db:
    image: postgres:15
    container_name: standard_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # You can change this later
      POSTGRES_DB: ${POSTGRES_DB}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./db-data:/var/lib/postgresql/data
    #ports:
     # - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  adminer:
    image: adminer:latest
    container_name: adminer_pro
    restart: always
    labels:
      - "traefik.enable=true"
      # 1. Routing Rule
      - "traefik.http.routers.adminer.rule=Host(`${DOMAIN_OR_IP}`) && PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls.certresolver=myresolver"
      - "traefik.http.routers.adminer.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.adminer.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
    environment:
      - ADMINER_DESIGN=pepa-linha
      - ADMINER_DEFAULT_SERVER=db
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  n8n_app:
    image: n8nio/n8n:latest
    container_name: n8n_app
    restart: always
    labels:
      - "traefik.enable=true"
      # MAIN ROUTER - explicitly uses main service (priority ~0)
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
      - "traefik.http.routers.n8n.service=n8n"           # ADD: explicit main service
      - "traefik.http.routers.n8n.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.n8n.tls.domains[0].sans=*.${BASE_DOMAIN}"

      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

      # BLOCKER ROUTER - explicitly uses blocker service (priority 100)
      - "traefik.http.routers.n8n-blocker.rule=Host(`${N8N_DOMAIN}`) && (PathPrefix(`/webhook`) || PathPrefix(`/webhook-test`))"
      - "traefik.http.routers.n8n-blocker.entrypoints=websecure"
      - "traefik.http.routers.n8n-blocker.tls.certresolver=myresolver"
      - "traefik.http.routers.n8n-blocker.priority=100"
      - "traefik.http.routers.n8n-blocker.service=n8n-blocker"  # ADD: explicit blocker service
      - "traefik.http.services.n8n-blocker.loadbalancer.server.port=5678"
      - "traefik.http.middlewares.n8n-deny.ipwhitelist.sourcerange=1.1.1.1/32"
      - "traefik.http.routers.n8n-blocker.middlewares=n8n-deny"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB}
      - DB_POSTGRESDB_USER=${N8N_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - NODES_EXCLUDE=[]
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=90
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=2500
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - N8N_LOG_LEVEL=warn
    expose:
      - "5678"
    volumes:
      - ./flows2:/home/node/.n8n
      - ./public/images:/home/node/.n8n-files/public/images
      - ./n8n-workflows:/home/node/.n8n-files/workflows
    #entrypoint: ["/bin/sh", "/home/node/.n8n-files/workflows/n8n-init/n8n-import.sh"]
    depends_on:
      db:
        condition: service_healthy


  image_server:
    image: nginx:alpine
    container_name: image_server
    labels:
      - "traefik.enable=true"
      # Route for Images - No StripPrefix needed
      - "traefik.http.routers.images.rule=Host(`${DOMAIN_OR_IP}`) && PathPrefix(`/images`)"
      - "traefik.http.routers.images.entrypoints=websecure"
      - "traefik.http.routers.images.tls.certresolver=myresolver"
      - "traefik.http.routers.images.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.images.tls.domains[0].sans=*.${BASE_DOMAIN}"
      # Nginx alpine default port is 80
      - "traefik.http.services.images.loadbalancer.server.port=80"
    restart: always
    expose:
      - "80"
    volumes:
      - ./public/images:/usr/share/nginx/html/images:ro


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN_OR_IP}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.frontend.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.frontend.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
      - "traefik.http.routers.frontend.middlewares=frontend-auth"
      - "traefik.http.middlewares.frontend-auth.forwardauth.address=http://n8n_app:5678/webhook/admin/authenticate"
      - "traefik.http.middlewares.frontend-auth.forwardauth.trustForwardHeader=true"
    restart: always
    ports:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overwriting container ones
    environment:
      - VITE_API_BASE_URL=${API_BASE_URL}
      - VITE_IMAGE_BASE_URL=${IMAGE_BASE_URL}
      - VITE_CURRENCY=$
      - VITE_APP_TITLE=Precious Place POS
      - VITE_APP_ICON=/icon.png
      - VITE_LOGO=precious_place_logo-removebg.png
      - DOMAIN_OR_IP=${DOMAIN_OR_IP}
      - VITE_GET_PRODUCTS_WEBHOOK=${API_BASE_URL}pos/products
      - VITE_RECORD_SALES_WEBHOOK=${API_BASE_URL}pos/recordSales
      - VITE_DAILY_SALES_WEBHOOK=${API_BASE_URL}pos/dailyTotalSales
      
    depends_on:
      - n8n_app
      - image_server
      - python_app
    
    
  ledger_frontend:
    build:
      context: ./ledger-frontend
      dockerfile: Dockerfile
    container_name: ledger_frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ledger.rule=Host(`${DOMAIN_OR_IP}`) && PathPrefix(`/accounting`)"
      - "traefik.http.routers.ledger.entrypoints=websecure"
      - "traefik.http.routers.ledger.tls.certresolver=myresolver"
      - "traefik.http.routers.ledger.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.ledger.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.ledger.loadbalancer.server.port=5174"
      # Forward Auth
      - "traefik.http.routers.ledger.middlewares=ledger-auth"
      - "traefik.http.middlewares.ledger-auth.forwardauth.address=http://n8n_app:5678/webhook/admin/authenticate"
      - "traefik.http.middlewares.ledger-auth.forwardauth.trustForwardHeader=true"
    restart: always
    ports:
      - "5174"  
    volumes:
      - ./ledger-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${API_BASE_URL}
      - VITE_APP_TITLE=Accounting
      - VITE_GET_JOURNAL_ENTRIES_WEBHOOK=${API_BASE_URL}accounting/journalEntries
      - VITE_GET_ACCOUNTS_WEBHOOK=${API_BASE_URL}accounting/accounts
      - VITE_GET_GENERAL_LEDGER_WEBHOOK=${API_BASE_URL}accounting/ledger
      - VITE_GET_TRIAL_BALANCE_WEBHOOK=${API_BASE_URL}accounting/trialBalance
      - VITE_GET_CATEGORIES_WEBHOOK=${API_BASE_URL}accounting/categories
      - VITE_GET_BALANCE_SHEET_WEBHOOK=${API_BASE_URL}accounting/balanceSheet
      - VITE_GET_PROFIT_LOSS_WEBHOOK=${API_BASE_URL}accounting/profitAndLoss
      - VITE_POST_JOURNAL_ENTRIES_WEBHOOK=${API_BASE_URL}accounting/journalEntry
      - VITE_CREATE_ACCOUNT_WEBHOOK=${API_BASE_URL}accounting/createAccount
      - VITE_GET_INCOME_WEBHOOK=${API_BASE_URL}accounting/incomeReport
      - VITE_GET_EXPENSE_WEBHOOK=${API_BASE_URL}accounting/expenseReport
      - DOMAIN_OR_IP=${DOMAIN_OR_IP}
    depends_on:
      - n8n_app
      - python_app
  
  custom_cake_frontend:
    build:
      context: ./custom_cake_frontend
      dockerfile: Dockerfile
    container_name: custom_cake_frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.custom_cake.rule=Host(`${DOMAIN_OR_IP}`) && PathPrefix(`/custom-cake-manager`)"
      - "traefik.http.routers.custom_cake.entrypoints=websecure"
      - "traefik.http.routers.custom_cake.tls.certresolver=myresolver"
      - "traefik.http.routers.custom_cake.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.custom_cake.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.custom_cake.loadbalancer.server.port=5175"
      # Forward Auth
      - "traefik.http.routers.custom_cake.middlewares=custom-cake-auth"
      - "traefik.http.middlewares.custom-cake-auth.forwardauth.address=http://n8n_app:5678/webhook/admin/authenticate"
      - "traefik.http.middlewares.custom-cake-auth.forwardauth.trustForwardHeader=true"
    restart: always
    ports:
      - "5175"  
    volumes:
      - ./custom_cake_frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${API_BASE_URL}
      - VITE_APP_TITLE=Custom Cake
      - DOMAIN_OR_IP=${DOMAIN_OR_IP}
      - VITE_IMAGE_BASE_URL=${IMAGE_BASE_URL}
    depends_on:
      - n8n_app
      - python_app

  python_app:
    build:
      context: ./python_app
      dockerfile: Dockerfile
    container_name: python_app
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.python-api-public.rule=Host(`${DOMAIN_OR_IP}`) && (PathPrefix(`/api/telegram`) || PathPrefix(`/api/cakeOrder`))"
      - "traefik.http.routers.python-api-public.entrypoints=websecure"
      - "traefik.http.routers.python-api-public.tls.certresolver=myresolver"
      - "traefik.http.routers.python-api-public.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.python-api-public.tls.domains[0].sans=*.${BASE_DOMAIN}"

      - "traefik.http.routers.python-api-public.priority=200" 
      - "traefik.http.routers.python-api-public.service=python-api-service"

      - "traefik.http.routers.python-api-private.rule=Host(`${DOMAIN_OR_IP}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.python-api-private.entrypoints=websecure"
      - "traefik.http.routers.python-api-private.tls.certresolver=myresolver"
      - "traefik.http.routers.python-api-private.priority=100" 
      - "traefik.http.routers.python-api-private.middlewares=python-auth"
      - "traefik.http.routers.python-api-private.service=python-api-service"

      - "traefik.http.services.python-api-service.loadbalancer.server.port=5000"

      - "traefik.http.middlewares.python-auth.forwardauth.address=http://n8n_app:5678/webhook/admin/authenticate"
      - "traefik.http.middlewares.python-auth.forwardauth.trustForwardHeader=true"
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - N8N_INTERNAL_URL=${N8N_INTERNAL_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DOMAIN_OR_IP=${DOMAIN_OR_IP}
      - CAKE_ORDER_TELEGRAM_BOT_TOKEN=${CAKE_ORDER_TELEGRAM_BOT_TOKEN}
    depends_on:
      - n8n_app

  traefik:
    image: traefik:latest
    container_name: traefik
    environment:
      - CF_DNS_API_TOKEN=${DNS_TOKEN}
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP to HTTPS automatically
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Cloudflare DNS Challenge Setup
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.myresolver.acme.email=${ADMIN_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      # Use Cloudflare's DNS for the challenge check
      - "--certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    depends_on:
      - image_server
      - db
      - n8n_app
      - frontend
      - ledger_frontend

  


    
