services:

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: always
    environment:
      - SUBDOMAINS=${SUB_DOMAIN}        # e.g., if you have my-pos.duckdns.org, put 'my-pos'
      - TOKEN=${DNS_TOKEN}        # Get this from duckdns.org
      - LOG_FILE=false
  
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy
    restart: always
    ports:
      - '80:80'    # HTTP
      - '443:443'  # HTTPS
      - '81:81'    # Admin UI
    volumes:
      - ./npm-data:/data
      - ./npm-letsencrypt:/etc/letsencrypt

  # The Memory: Database
  db:
    image: postgres:15
    container_name: standard_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # You can change this later
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./db-data:/var/lib/postgresql/data
    #ports:
     # - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  adminer:
    image: adminer:latest
    container_name: adminer_pro
    restart: always
    ports:
      - "8083:8080"  # External 8083 maps to Adminer internal 8080
    environment:
      - ADMINER_DESIGN=pepa-linha # Clean theme for SQL crafting
      - ADMINER_DEFAULT_SERVER=db  # Pre-fills the 'Server' field with your DB service name
    depends_on:
      db:
        condition: service_healthy

  # The Brain: Automation (n8n)
  n8n:
    image: n8nio/n8n:latest
    container_name: standard_brain
    restart: always
    environment:
      - N8N_PROTOCOL=https
      - N8N_HOST=${N8N_DOMAIN}
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      # Tells n8n the SSL is handled by NPM
      - N8N_SSL_TERMINATED=true 
    # Use the service name 'db' as defined in your compose
    volumes:
      - ./flows:/home/node/.n8n
      - ./public/images:/home/node/.n8n-files/public/images
      - ./n8n-workflows:/home/node/.n8n-files/workflows
    depends_on:
      db:
        condition: service_healthy 

  image_server:
    image: nginx:alpine
    ports:
      - "80"  # We'll use port 8081 to avoid conflicts
    volumes:
      - ./public/images:/usr/share/nginx/html/images:ro # 'ro' means read-only for safety

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: always
    ports:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overwriting container ones
    environment:
      - VITE_GET_PRODUCTS_WEBHOOK=${GET_PRODUCTS_WEBHOOK}
      - VITE_IMAGE_BASE_URL=${IMAGE_BASE_URL}
      - VITE_RECORD_SALES_WEBHOOK=${RECORD_SALES_WEBHOOK}
      - VITE_DAILY_SALES_WEBHOOK=${DAILY_SALES_WEBHOOK}
      - VITE_CURRENCY=${CURRENCY}
      - VITE_APP_TITLE=${VITE_APP_TITLE}
      - VITE_APP_ICON=${VITE_APP_ICON}
      - VITE_LOGO=${VITE_LOGO}
    depends_on:
      - n8n
      - image_server
    
  ledger_frontend:
    build:
      context: ./ledger-frontend
      dockerfile: Dockerfile
    container_name: ledger_frontend
    restart: always
    ports:
      - "5174"   # external 5174 → internal Vite 5173
    volumes:
      - ./ledger-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL_LEDGER}
      - VITE_APP_TITLE=${VITE_APP_TITLE_LEDGER}
      - VITE_POST_JOURNAL_ENTRIES_WEBHOOK=${VITE_POST_JOURNAL_ENTRIES_WEBHOOK}
      - VITE_GET_JOURNAL_ENTRIES_WEBHOOK=${VITE_GET_JOURNAL_ENTRIES_WEBHOOK}
      - VITE_GET_ACCOUNTS_WEBHOOK=${VITE_GET_ACCOUNTS_WEBHOOK}
      - VITE_GENERAL_LEDGER_WEBHOOK=${VITE_GENERAL_LEDGER_WEBHOOK}
      - VITE_TRIAL_BALANCE_WEBHOOK=${VITE_TRIAL_BALANCE_WEBHOOK}
      - VITE_CREATE_ACCOUNT_WEBHOOK=${VITE_CREATE_ACCOUNT_WEBHOOK}
      - VITE_GET_CATEGORIES_WEBHOOK=${VITE_GET_CATEGORIES_WEBHOOK}
      - VITE_BALANCE_SHEET_WEBHOOK=${VITE_BALANCE_SHEET_WEBHOOK}
      - VITE_PROFIT_LOSS_WEBHOOK=${VITE_PROFIT_LOSS_WEBHOOK}
    depends_on:
      - n8n
  
  
  
  
  
  
  


 
